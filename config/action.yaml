# =============================================================
# 动作注册表 —— 决策模型可以输出的所有动作
# =============================================================
# 每个动作一个条目，字段说明：
#   params:       必填参数列表（模型输出 JSON 的 args 里必须包含这些键）
#   description:  中文描述，会原样写进 system prompt 给模型看
#   kind:         执行方式：
#                   env      —— 交给环境执行（可带坐标定位）
#                   shell    —— 终端命令（run_in_terminal），在目标机终端执行
#                   subagent —— 子 Agent（call_code_agent），独立跑批量代码/文件操作
#                   terminal —— 终止动作（done / fail），结束整个任务
#   resolve:      （仅 kind=env 需要）坐标解析方式：
#                   none   —— 不需要定位坐标
#                   point  —— target 描述 -> 一个坐标 (x, y)
#                   select —— target 描述 -> 坐标 (x, y) + 保留 option
#                   drag   —— from_target / to_target -> 两个坐标 (x1,y1,x2,y2)
#   capability:   可选环境能力；没有该能力的环境不向模型提供此动作
# =============================================================

actions:
  click:
    params: [target]
    description: "点击某个元素（target 用英文描述整个元素，如 \"The 'Remove Account' option in the Account Actions dropdown menu\"）"
    kind: env
    resolve: point

  double_click:
    params: [target]
    description: "双击某个元素"
    kind: env
    resolve: point

  right_click:
    params: [target]
    description: "右键点击某个元素"
    kind: env
    resolve: point

  type:
    params: [target, text]
    description: "点击并聚焦目标输入框/区域（target），然后输入文字（text）。默认是【追加】到光标处；若要【覆盖】原有内容（修改已有值，如把 80 改成 50），加可选参数 overwrite: true，会先清空原内容再输入新文字"
    kind: env
    resolve: point

  scroll:
    params: [direction, amount]
    description: "滚动页面（direction=up/down，amount=滚动格数）"
    kind: env
    resolve: none

  press:
    params: [key]
    description: "按单个键（key），如 Enter / Tab / Esc / backspace（退格删除前一个字符）/ delete（删除后一个字符）/ 方向键"
    kind: env
    resolve: none

  hotkey:
    params: [keys]
    description: "按组合键（keys 是列表，如 [\"ctrl\",\"c\"]）"
    kind: env
    resolve: none

  goto:
    params: [url]
    description: "浏览器打开网址（url）"
    kind: env
    resolve: none

  open_browser:
    params: []
    description: "创建或激活当前任务的专用浏览器，可选 url。网页任务优先使用此动作；普通桌面操作照常使用截图。结构不可用时继续视觉操作。"
    kind: env
    resolve: none
    capability: browser_runtime

  select:
    params: [target, option]
    description: "在下拉框里选一项（target=下拉框描述，option=要选的选项文字）"
    kind: env
    resolve: select

  drag_and_drop:
    params: [from_target, to_target]
    description: "把元素 A 拖到元素 B（from_target=起点元素描述，to_target=终点元素描述）"
    kind: env
    resolve: drag

  set_cell_values:
    params: [new_cell_values, app_name, sheet_name]
    description: "批量直写表格单元格（不经 GUI）。new_cell_values 如 {\"A1\": 5, \"B1\": \"=SUM(A1:A10)\"}；app_name 填【文档标题/文件名】（从窗口标题栏看，如 NetIncome.xlsx），不是应用名；sheet_name 填工作表名（如 Sheet1）"
    kind: uno
    resolve: none

  save:
    params: []
    description: "保存当前文档（程序化保存，避开格式确认弹窗）"
    kind: uno
    resolve: none

  switch_applications:
    params: [app_code]
    description: "切换活动应用窗口（app_code 如 libreoffice_calc / chrome / libreoffice_writer）"
    kind: env
    resolve: none

  wait:
    params: [seconds]
    description: "等待若干秒（seconds）"
    kind: env
    resolve: none

  run_in_terminal:
    params: [command]
    description: "在终端里执行一条命令（command），命令输出会在下一步返回给你（按当前操作系统写命令）"
    kind: shell
    resolve: none

  get_page_source:
    params: []
    description: "按需读取精简 DOM，target_ref 可选（限定到该节点），结果有长度上限"
    kind: browser
    resolve: none

  inspect_page:
    params: [query]
    description: "按query检索局部网页语义；scope_ref可限定区域，cursor可继续读取。只在browser_use=1时使用"
    kind: browser
    resolve: none

  call_code_agent:
    params: []
    description: "委托子 Agent 执行批量代码/文件操作（task 可省略，省略则处理整个任务；如 openpyxl 批量填表、unzip 解压、pdftotext 提取文本）"
    kind: subagent
    resolve: none

  # ---- 终止动作 ----
  request_finish:
    params: [answer]
    description: "请求结束任务并给出最终答案（answer 直接写找到的结果）；程序会验证是否真的完成，未完成会被拒绝"
    kind: terminal
    resolve: none

  fail:
    params: []
    description: "任务无法完成（目标功能已不存在 / 资源不可达），放弃并结束"
    kind: terminal
    resolve: none


# =============================================================
# 额外动作（扩展区）
# =============================================================
# 测试 / 新任务想给模型增加一个可输出的动作，就在这里按上面的字段格式注册，
# 会与上面的 actions 自动合并。例如：
#
# extra_actions:
#   hover:
#     params: [target]
#     description: "鼠标悬停在某个元素上"
#     kind: env
#     resolve: point
# =============================================================
extra_actions: {}
