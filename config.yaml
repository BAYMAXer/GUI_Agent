# osworld_agent 示例配置
# model 与 grounding_model 独立配置。服务别名和实际模型 ID 在 config/model_registry.py 维护。
# 这是旧 OSWorld 配置示例，不是 Windows 浏览器启动配置。
# 新电脑使用 setup.cmd / run.cmd，模型参数修改仓库根目录 .env。

# ---------------- 决策模型 ----------------
model:
  name: "planning"           # 也可填实际部署的决策模型 ID
  url: "http://7.246.80.237:9028/v1"
  api_key: "EMPTY"
  temperature: 0.3
  max_tokens: 2048
  vision: true               # 是否把截图喂给决策模型（纯文本模型设 false）

# ---------------- 视觉定位模型 ----------------
grounding_model:
  name: "grounding"
  protocol: "structured"
  url: "http://7.246.80.237:9028/v1"
  api_key: "EMPTY"
  width: 1920
  height: 1080
  thinking_style: "vllm"
  policy_revision: ""
  collect_logprobs: false
  return_token_ids: false
  context:
    max_input_tokens: 8192
    text_tokens: 2048
    expanded_text_tokens: 4096
    output_reserve: 256
    candidate_limit: 20
    expanded_candidate_limit: 40
    max_calls: 2
    tokenizer_path: ""
    processor_path: ""

# ---------------- 智能体循环 ----------------
agent:
  max_steps: 20              # 单任务最大步数
  max_retries: 3             # 动作解析失败最多重试几次
  enable_reflection: true    # 是否开启反思（reflection）
  early_stop_repeat: 3       # 连续相同动作 N 次即早停

# ---------------- 环境 ----------------
env:
  provider: "osworld"        # 目前只支持 osworld
  os: "linux"                # 目标机操作系统：linux / mac / windows（决定终端命令 shell）
  vm_path: "/data/osworld-agent-s/vm/uploaded/Ubuntu.qcow2"
  sleep_after_execution: 1.5 # 每步动作后等待秒数（截图前）
  headless: false
  screen_width: 1920
  screen_height: 1080

# ---------------- 输入预算（所有任务共用） ----------------
context:
  context_window: 32768
  max_input_tokens: 12288
  output_reserve: 2048
  safety_margin: 1024
  image_tokens: 2048       # 估计值；上线前按对应模型的 processor 校准
  max_images: 2
  structured_max_images: 1 # 有 AX 信息时默认只带当前截图
  memory_tokens: 2200
  auxiliary_tokens: 1200
  structure_tokens: 2000
  structure_max_tokens: 3500
  tokenizer_path: ""      # 配对应模型的本地 tokenizer 可替代保守的 UTF-8 字节计数
  processor_path: ""      # 配与模型服务一致的processor，核算图像和聊天模板
