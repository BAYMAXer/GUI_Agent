[build-system]
requires = ["setuptools>=68,<85"]
build-backend = "setuptools.build_meta"

[project]
name = "osworld-agent"
version = "3.1.0"
description = "GUI agent with Windows desktop and optional browser structure"
requires-python = ">=3.12,<3.13"
dynamic = ["dependencies"]

[tool.uv]
required-version = ">=0.12.23,<1"
cache-keys = [{file = "pyproject.toml"}, {file = "requirements-browser.txt"}]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.setuptools]
packages = ["osworld_agent", "osworld_agent.adapters", "osworld_agent.config", "osworld_agent.memory", "osworld_agent.model", "osworld_agent.rl", "osworld_agent.script", "osworld_agent.skills", "osworld_agent.viz"]
package-dir = {osworld_agent = "."}

[tool.setuptools.dynamic]
dependencies = {file = ["requirements-browser.txt"]}

[tool.setuptools.package-data]
osworld_agent = ["config.yaml", "tests/fixtures/*.html"]
"osworld_agent.config" = ["action.yaml", "skills.yaml", "model_presets.yaml", "environment_aliases.json"]
"osworld_agent.viz" = ["static/*.html"]
